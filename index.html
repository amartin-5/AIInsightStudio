<!doctype html>
<!--
  data-theme MUST match the `mode` passed to <CakeProvider> in src/App.tsx.

  CakeProvider sets this attribute on <html> in a layout effect, so the very
  first paint uses whatever is written here. If the two disagree you get a
  visible flash of the wrong theme before React catches up. Change both together.
-->
<html lang="en" data-theme="light.a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insight Studio</title>
    <style>
      /* Presentation root — keep page chrome out of the Windows mock. */
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: var(--font-family);
        background: #03013d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
